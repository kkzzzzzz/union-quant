name: Daily Quant Data & Strategy Signal Pipeline

on:
  # 定时运行 (UTC 时间)：
  # 1. 每个交易日 UTC 14:30 (北京时间 22:30)：A股/港股收盘及好买估值更新后拉取并算信号
  # 2. 每个交易日 UTC 23:30 (北京时间次日 07:30)：美股(NDX/SPX)收盘后盘前更新并发布最新 GitHub Pages
  schedule:
    - cron: '30 14 * * 1-5'
    - cron: '30 23 * * 1-5'

  # 支持在 GitHub Actions 页面手动一键触发
  workflow_dispatch:
    inputs:
      sync_mode:
        description: '数据同步模式 (daily=日常增量, catchup=晚间估值重拉)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - catchup
      send_notify:
        description: '是否推送钉钉/飞书/企微通知'
        required: false
        default: true
        type: boolean

# 赋予构建并部署 GitHub Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-quant-pipeline"
  cancel-in-progress: false

jobs:
  run-quant-and-deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Sync Daily Market & Valuation Data + Compute Factors
        run: |
          MODE="${{ github.event.inputs.sync_mode || 'daily' }}"
          python cli.py sync --mode "$MODE" --compute-factors --factor-tail 90 --notify

      - name: 5. Compute Daily Strategy Signals (T+1) & Push Notification
        run: |
          if [ "${{ github.event.inputs.send_notify }}" = "false" ]; then
            python cli.py signal --all --mode live --no-notify
          else
            python cli.py signal --all --mode live
          fi

      - name: 6. Build Static GitHub Pages Dashboard (site/)
        run: |
          python cli.py export-pages --out-dir site

      - name: 7. Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 8. Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: 9. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
