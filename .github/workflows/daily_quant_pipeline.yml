name: Daily Quant Data & Strategy Signal Pipeline

on:
  # 定时运行 (UTC 时间)：
  # 1. 每个交易日 UTC 14:30 (北京时间 22:30)：A股/港股收盘及好买估值更新后拉取并算信号
  # 2. 每个交易日 UTC 23:30 (北京时间次日 07:30)：美股(NDX/SPX)收盘后盘前更新并自动触发 Vercel 部署
  schedule:
    - cron: '30 14 * * 1-5'
    - cron: '30 23 * * 1-5'

  # 支持在 GitHub Actions 页面手动一键触发
  workflow_dispatch:
    inputs:
      sync_mode:
        description: '数据同步模式 (daily=日常增量, catchup=晚间估值重拉)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - catchup
      send_notify:
        description: '是否推送钉钉/飞书/企微通知'
        required: false
        default: true
        type: boolean

# 赋予回写 site/ 静态数据的权限（供 Vercel 自动部署）
permissions:
  contents: write

concurrency:
  group: "daily-quant-pipeline"
  cancel-in-progress: false

jobs:
  run-quant-and-deploy-vercel:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Full Daily Shadow Pipeline (Sync Data -> Factors -> Shadow Strategy -> Diff Report & Notify)
        run: |
          MODE="${{ github.event.inputs.sync_mode || 'daily' }}"
          if [ "${{ github.event.inputs.send_notify }}" = "false" ]; then
            python cli.py shadow-pipeline --mode "$MODE" --no-notify
          else
            python cli.py shadow-pipeline --mode "$MODE"
          fi


      - name: 6. Build Static Vercel Dashboard (site/)
        run: |
          python cli.py export-pages --out-dir site

      - name: 7. Commit Updated site/ to Main Branch (Triggers Vercel Auto-Deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          if ! git diff --staged --quiet; then
            git commit -m "chore(site): update daily quant dashboard data"
            git push origin HEAD:main
          fi
