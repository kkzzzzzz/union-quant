strategy_id: "nasdaq_dynamic_position"
name: "纳指100动态仓位调度策略 (Trial 039)"
type: "dynamic_engine"
version: "2.0"
description: "以纳指100为核心(base=0.52, c1=1.5)的9资产PE分位动态配置 + RSI/LogBias双因子极值触发调仓"

execution:
  mode: "next_day_close_proxy"
  initial_capital: 1000000.0
  commission_rate: 0.0001
  slippage_rate: 0.0005
  min_commission: 5.0

rebalance:
  frequency: "extremum_signal"
  extremum_trigger:
    enabled: true
    monitor_symbols: ["NDX.GI", "SPX.GI", "HSTECH.HI", "000300.SH"]
    lookback_days: 756
    rsi_window: 14
    bias_window: 20
    quantile_high: 0.90
    quantile_low: 0.05
    cooldown_days: 30
    max_days_without_rebalance: 90

