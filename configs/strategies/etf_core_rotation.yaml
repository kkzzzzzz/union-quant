strategy_id: "etf_core_rotation"
name: "核心四资产ETF相对动量轮动"
type: "etf_weekly_momentum"
version: "2.0"
description: "沪深300ETF、国债ETF、纳指100ETF、黄金ETF四大核心资产20日纯相对动量每周五轮动"

execution:
  mode: "next_day_close_proxy"
  signal_cutoff: "same_day_close"
  initial_capital: 1000000.0
  commission_rate: 0.0001
  slippage_rate: 0.0005
  min_commission: 1.0

rebalance:
  frequency: "weekly"
  weekday: 4
  interval_weeks: 1

strategy_params:
  momentum_window: 20
  ma_window: 20
  enable_ma_filter: false
  top_k: 1
  fallback_mode: "cash"
  assets:
    - symbol: "510300.SH"
      name: "沪深300ETF"
    - symbol: "511010.SH"
      name: "国债ETF"
    - symbol: "513100.SH"
      name: "纳指ETF国泰"
    - symbol: "518880.SH"
      name: "黄金ETF华安"
